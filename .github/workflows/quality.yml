name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agendai_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: agendai_ci_owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendai_ci_owner -d agendai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONFIRM_POSTGRES_TEST_DB: agendai_test
      DATABASE_TEST_URL: postgresql://agendai_ci_owner:ci-only-password@127.0.0.1:5432/agendai_test
      NODE_ENV: test
      RUN_POSTGRES_INTEGRATION: "1"
      RUN_POSTGRES_ROLE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run test:integration

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - run: npm run build

  prototype-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: design-prototype/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
